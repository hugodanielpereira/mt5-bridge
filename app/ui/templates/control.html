<!-- app/ui/templates/control.html -->
<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>MLSL Control Panel</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/ui/static/css/app.css">
</head>
<body>
<header class="topbar">
  <nav class="tabs">
    <a class="tab-link" href="/ui/?tab=dash" data-tab="dash">Dashboard</a>
    <a class="tab-link" href="/ui/?tab=ops"  data-tab="ops">Ops</a>
    <a class="tab-link active" href="/ui/control/" data-tab="control">Control</a>
  </nav>
  <div class="topbar-right">
    <button id="themeToggle" class="btn-small" title="Alternar tema">☀️</button>
  </div>
</header>

<main>
  <h2 class="title" style="margin:8px 0">Control Panel</h2>
  <div class="muted">
    Arranque/Paragem dos serviços e emissão de comandos via <code>/ui/ops/run</code>.
    A API key é guardada localmente no browser.
  </div>

  <div class="card" style="margin-top:12px">
    <label>API Key:
      <input id="api-key" type="password" placeholder="X-API-Key" style="margin-left:6px">
    </label>
    <button id="save-key" class="btn-small" style="margin-left:6px">Guardar</button>
  </div>

  <div class="card"><div class="title">Bridge</div>
    <button id="btn-bridge-start">Start</button>
    <button id="btn-bridge-start-vis">Start (visível)</button>
    <button id="btn-bridge-stop">Stop</button>
    <button id="btn-bridge-restart">Restart</button>
    <button id="btn-bridge-restart-vis">Restart (visível)</button>
  </div>

  <div class="card"><div class="title">Executor</div>
    <button id="btn-executor-start">Start</button>
    <button id="btn-executor-start-vis">Start (visível)</button>
    <button id="btn-executor-stop">Stop</button>
    <button id="btn-executor-restart">Restart</button>
    <button id="btn-executor-restart-vis">Restart (visível)</button>
  </div>

  <div class="card"><div class="title">Scheduler / Retrain</div>
    <button id="btn-scheduler-start">Start</button>
    <button id="btn-scheduler-start-vis">Start (visível)</button>
    <button id="btn-scheduler-stop">Stop</button>
    <button id="btn-scheduler-restart">Restart</button>
    <button id="btn-scheduler-restart-vis">Restart (visível)</button>
  </div>

  <div class="card"><div class="title">Watcher</div>
    <button id="btn-watcher-start">Start</button>
    <button id="btn-watcher-start-vis">Start (visível)</button>
    <button id="btn-watcher-stop">Stop</button>
    <button id="btn-watcher-restart">Restart</button>
    <button id="btn-watcher-restart-vis">Restart (visível)</button>
  </div>

  <div class="card"><div class="title">Emitter</div>
    <button id="btn-emitter-start">Start</button>
    <button id="btn-emitter-start-vis">Start (visível)</button>
    <button id="btn-emitter-stop">Stop</button>
    <button id="btn-emitter-restart">Restart</button>
    <button id="btn-emitter-restart-vis">Restart (visível)</button>
  </div>

  <div class="card"><div class="title">Governor</div>
    <button id="btn-governor-start">Start</button>
    <button id="btn-governor-start-vis">Start (visível)</button>
    <button id="btn-governor-stop">Stop</button>
    <button id="btn-governor-restart">Restart</button>
    <button id="btn-governor-restart-vis">Restart (visível)</button>
  </div>

  <div class="card"><div class="title">Promoter</div>
    <button id="btn-promoter-start">Start</button>
    <button id="btn-promoter-start-vis">Start (visível)</button>
    <button id="btn-promoter-stop">Stop</button>
    <button id="btn-promoter-restart">Restart</button>
    <button id="btn-promoter-restart-vis">Restart (visível)</button>
  </div>

  <div class="card"><div class="title">Position Manager</div>
    <button id="btn-position_manager-start">Start</button>
    <button id="btn-position_manager-start-vis">Start (visível)</button>
    <button id="btn-position_manager-stop">Stop</button>
    <button id="btn-position_manager-restart">Restart</button>
    <button id="btn-position_manager-restart-vis">Restart (visível)</button>
  </div>

  <div class="card"><div class="title">All</div>
    <button id="btn-all-start">ALL Start</button>
    <button id="btn-all-stop">ALL Stop</button>
    <button id="btn-all-restart">ALL Restart</button>
  </div>

  <div class="card">
    <div class="title">Output</div>
    <textarea id="ops-output" rows="14" style="width:100%" readonly></textarea>
  </div>
</main>

<script src="/ui/static/js/common.js"></script>
<script src="/ui/static/js/control.js"></script>
</body>
</html>
